# Local development & testing stack.
#   docker compose up -d postgres redis      # just the dependencies (run the API with pnpm dev)
#   docker compose --profile app up -d       # also run the API container
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lobbyup
      POSTGRES_PASSWORD: lobbyup
      POSTGRES_DB: lobbyup
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lobbyup"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # AOF persistence so the short-lived answer buffer survives a Redis restart.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://lobbyup:lobbyup@postgres:5432/lobbyup?connection_limit=20
      DIRECT_DATABASE_URL: postgresql://lobbyup:lobbyup@postgres:5432/lobbyup
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
